[project]
name = "nexusai-client"
version = "0.1.0"
description = "A lightweight, unified asynchronous Python client for multi-provider AI APIs."
readme = "README.md"
authors = [
    { name = "Laurent VOLFF", email = "laurentvv@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["uv_build>=0.11.5,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
