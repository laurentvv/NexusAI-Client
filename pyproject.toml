[project]
name = "nexusai-client"
version = "0.1.0"
description = "A lightweight, unified asynchronous Python client for multi-provider AI APIs (Cerebras, Cohere, DeepSeek, Gemini, Groq, Mistral, Nvidia NIM, OpenRouter, OrcaRouter) with smart free-first fallback."
readme = "README_PYPI.md"
authors = [
    { name = "Laurent VOLFF", email = "laurentvv@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "ai",
    "llm",
    "gateway",
    "async",
    "streaming",
    "fallback",
    "openai",
    "gemini",
    "groq",
    "mistral",
    "deepseek",
    "cohere",
    "cerebras",
    "nvidia",
    "openrouter",
    "orcarouter",
    "httpx",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
]

[project.urls]
Homepage = "https://github.com/laurentvv/NexusAI-Client"
Repository = "https://github.com/laurentvv/NexusAI-Client"
Documentation = "https://github.com/laurentvv/NexusAI-Client/blob/main/INTEGRATION_GUIDE.md"
Changelog = "https://github.com/laurentvv/NexusAI-Client/releases"
Issues = "https://github.com/laurentvv/NexusAI-Client/issues"

[build-system]
requires = ["uv_build>=0.11.5,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
